<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Products | Kaycy Mart</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    color:#172033;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

.header{
    background:#111827;
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.header-inner{
    max-width:1400px;
    margin:auto;
    min-height:68px;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#f59e0b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.brand-text h1{
    font-size:20px;
}

.brand-text p{
    font-size:11px;
    color:#cbd5e1;
    margin-top:2px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:none;
    background:#1f2937;
    color:white;
    padding:9px 12px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
}

.header-btn:hover{
    background:#374151;
}

/* PAGE */

.container{
    max-width:1400px;
    margin:auto;
    padding:22px 16px 45px;
}

.page-heading{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.page-heading h2{
    font-size:28px;
    color:#111827;
}

.page-heading p{
    color:#6b7280;
    font-size:14px;
    margin-top:5px;
}

.product-count{
    background:#fff;
    border:1px solid #e5e7eb;
    padding:9px 13px;
    border-radius:9px;
    font-size:13px;
}

/* FORM */

.form-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.form-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:18px;
    color:#111827;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:13px;
    font-weight:bold;
    color:#374151;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:11px 12px;
    outline:none;
    background:white;
    color:#111827;
}

.field textarea{
    min-height:105px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#f59e0b;
    box-shadow:0 0 0 3px rgba(245,158,11,.12);
}

/* IMAGE */

.image-preview{
    width:100%;
    max-width:220px;
    height:180px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #e5e7eb;
    background:#f8fafc;
    object-fit:contain;
    display:none;
}

.image-note{
    color:#6b7280;
    font-size:12px;
}

/* BUTTONS */

.btn{
    border:none;
    border-radius:8px;
    padding:9px 13px;
    font-weight:bold;
    font-size:13px;
    transition:.2s;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-primary:hover{
    background:#f59e0b;
    color:#111827;
}

.btn-gold{
    background:#f59e0b;
    color:#111827;
}

.btn-gold:hover{
    background:#d97706;
    color:white;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.btn-danger:hover{
    background:#dc2626;
    color:white;
}

.btn-small{
    padding:7px 10px;
    font-size:12px;
}

/* FORM ACTIONS */

.form-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid #e5e7eb;
}

#message{
    margin-top:12px;
    font-size:13px;
    font-weight:bold;
}

.success{
    color:#15803d;
}

.error{
    color:#dc2626;
}

.hidden{
    display:none!important;
}

/* INVENTORY */

.list-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.list-heading h2{
    font-size:21px;
}

.search-box{
    width:260px;
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:10px 12px;
    outline:none;
}

.search-box:focus{
    border-color:#f59e0b;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
}

.product-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 18px rgba(0,0,0,.08);
}

.product-card.is-hidden{
    opacity:.78;
    border-color:#fca5a5;
}

.product-image-wrap{
    height:190px;
    background:#f8fafc;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #e5e7eb;
}

.product-card img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.no-image{
    font-size:42px;
    opacity:.6;
}

/* STATUS */

.status-badge{
    position:absolute;
    top:9px;
    left:9px;
    padding:5px 8px;
    border-radius:999px;
    font-size:10px;
    font-weight:bold;
    z-index:2;
}

.status-active{
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.status-hidden{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.product-body{
    padding:13px;
}

.product-category{
    font-size:10px;
    color:#f59e0b;
    text-transform:uppercase;
    font-weight:bold;
    letter-spacing:.4px;
}

.product-name{
    font-size:15px;
    font-weight:bold;
    color:#111827;
    margin:5px 0;
    line-height:1.3;
}

.product-price{
    font-size:17px;
    font-weight:bold;
    color:#111827;
}

.product-description{
    font-size:11px;
    color:#6b7280;
    margin-top:5px;
    line-height:1.4;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.visibility-btn{
    width:100%;
    margin-top:7px;
}

.btn-hide{
    background:#fff7ed;
    color:#c2410c;
    border:1px solid #fed7aa;
}

.btn-hide:hover{
    background:#f59e0b;
    color:#111827;
}

.btn-show{
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.btn-show:hover{
    background:#16a34a;
    color:white;
}

/* EMPTY / LOADING */

.empty-state{
    background:white;
    border:1px dashed #cbd5e1;
    border-radius:12px;
    padding:35px 15px;
    text-align:center;
    color:#6b7280;
    grid-column:1/-1;
}

.loading{
    text-align:center;
    padding:35px;
    color:#6b7280;
    grid-column:1/-1;
}

/* MOBILE */

@media(max-width:1050px){

    .products-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

}

@media(max-width:750px){

    .header-inner{
        min-height:60px;
        padding:8px 12px;
    }

    .brand-icon{
        width:38px;
        height:38px;
    }

    .brand-text h1{
        font-size:17px;
    }

    .header-btn{
        padding:8px 9px;
        font-size:11px;
    }

    .container{
        padding:16px 10px 35px;
    }

    .page-heading{
        align-items:flex-start;
        flex-direction:column;
    }

    .page-heading h2{
        font-size:23px;
    }

    .form-card{
        padding:14px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .list-heading{
        align-items:stretch;
        flex-direction:column;
    }

    .search-box{
        width:100%;
    }

    .products-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:9px;
    }

    .product-image-wrap{
        height:145px;
    }

    .product-body{
        padding:9px;
    }

    .product-name{
        font-size:13px;
    }

    .product-price{
        font-size:15px;
    }

    .card-actions{
        grid-template-columns:1fr;
    }

    .form-actions{
        flex-direction:column;
    }

    .form-actions .btn{
        width:100%;
    }

}

@media(max-width:380px){

    .products-grid{
        gap:7px;
    }

    .product-image-wrap{
        height:125px;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <div class="brand-icon">
                🛒
            </div>

            <div class="brand-text">

                <h1>
                    Kaycy Mart
                </h1>

                <p>
                    Admin Product Management
                </p>

            </div>

        </div>

        <div class="header-actions">

            <a
                href="Admin-Dashboard.html"
                class="header-btn"
            >
                Dashboard
            </a>

            <a
                href="Products.html"
                class="header-btn"
            >
                Store
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-heading">

        <div>

            <h2>Products</h2>

            <p>
                Add, edit and manage products.
                You can hide products instead of deleting them.
            </p>

        </div>

        <div
            class="product-count"
            id="productCount"
        >
            0 products
        </div>

    </div>


    <!-- PRODUCT FORM -->

    <section class="form-card">

        <div
            class="form-title"
            id="formTitle"
        >
            Add New Product
        </div>


        <form id="productForm">

            <div class="form-grid">

                <div class="field">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="e.g. Men's Sneakers"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Price (₦)
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="1"
                        placeholder="25000"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Category
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="fashion">
                            Fashion
                        </option>

                        <option value="home">
                            Home
                        </option>

                        <option value="gaming">
                            Gaming
                        </option>

                        <option value="beauty">
                            Beauty
                        </option>

                        <option value="phones">
                            Phones
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        Emoji
                    </label>

                    <input
                        type="text"
                        id="emoji"
                        placeholder="📱"
                    >

                </div>


                <div class="field full">

                    <label>
                        Product Image URL
                    </label>

                    <input
                        type="url"
                        id="image"
                        placeholder="https://example.com/product-image.jpg"
                    >

                    <div class="image-note">
                        Paste the direct image URL here.
                    </div>

                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Product image preview"
                    >

                </div>


                <div class="field full">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe the product..."
                    ></textarea>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="submitBtn"
                >
                    Add Product
                </button>

                <button
                    type="button"
                    class="btn btn-danger hidden"
                    id="cancelEditBtn"
                    onclick="cancelEdit()"
                >
                    Cancel Edit
                </button>

            </div>


            <div id="message"></div>

        </form>

    </section>


    <!-- INVENTORY -->

    <section>

        <div class="list-heading">

            <div>

                <h2>
                    Product Inventory
                </h2>

            </div>

            <input
                type="search"
                id="searchProducts"
                class="search-box"
                placeholder="Search products..."
                oninput="filterProducts()"
            >

        </div>


        <div
            id="productsGrid"
            class="products-grid"
        >

            <div class="loading">
                Loading products...
            </div>

        </div>

    </section>

</main>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
    "https://kaycy-backend.onrender.com";


/* =====================================================
   ADMIN AUTHENTICATION
===================================================== */

const adminLoggedIn =
    localStorage.getItem(
        "kaycyMartAdminLoggedIn"
    );

const adminRaw =
    localStorage.getItem(
        "kaycyMartAdmin"
    );

let admin = null;

try{

    admin =
        JSON.parse(
            adminRaw
        );

}catch(error){

    admin = null;

}


if(
    adminLoggedIn !== "true" ||
    !admin ||
    !admin.id ||
    String(
        admin.role || ""
    ).toLowerCase() !== "admin"
){

    localStorage.removeItem(
        "kaycyMartAdminLoggedIn"
    );

    localStorage.removeItem(
        "kaycyMartAdmin"
    );

    window.location.href =
        "Admin-Login.html";

}


const adminUserId =
    String(
        admin.id
    );


/* =====================================================
   STATE
===================================================== */

let products = [];

let editingProductId = null;


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatMoney(value){

    return "₦" +
        Number(
            value || 0
        ).toLocaleString(
            "en-NG"
        );

}


function adminHeaders(
    extraHeaders = {}
){

    return {

        ...extraHeaders,

        "x-admin-user-id":
            adminUserId

    };

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    message,
    type = "success"
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        message;

    box.className =
        type;

    setTimeout(() => {

        box.textContent = "";

        box.className = "";

    },5000);

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

document
    .getElementById("image")
    .addEventListener(
        "input",
        function(){

            const preview =
                document.getElementById(
                    "imagePreview"
                );

            const url =
                this.value.trim();

            if(!url){

                preview.src = "";

                preview.style.display =
                    "none";

                return;

            }

            preview.src =
                url;

            preview.style.display =
                "block";

            preview.onerror =
                function(){

                    this.style.display =
                        "none";

                };

        }
    );


/* =====================================================
   FORM SUBMIT
===================================================== */

document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();

            const submitBtn =
                document.getElementById(
                    "submitBtn"
                );

            const wasEditing =
                Boolean(
                    editingProductId
                );

            submitBtn.disabled =
                true;

            submitBtn.textContent =
                wasEditing
                    ? "Updating..."
                    : "Adding...";


            try{

                const payload = {

                    name:
                        document
                            .getElementById(
                                "name"
                            )
                            .value
                            .trim(),

                    price:
                        Math.max(
                            0,
                            Math.floor(
                                Number(
                                    document
                                        .getElementById(
                                            "price"
                                        )
                                        .value
                                ) || 0
                            )
                        ),

                    category:
                        document
                            .getElementById(
                                "category"
                            )
                            .value,

                    emoji:
                        document
                            .getElementById(
                                "emoji"
                            )
                            .value
                            .trim(),

                    description:
                        document
                            .getElementById(
                                "description"
                            )
                            .value
                            .trim(),

                    image:
                        document
                            .getElementById(
                                "image"
                            )
                            .value
                            .trim()

                };


                if(!payload.name){

                    throw new Error(
                        "Product name is required."
                    );

                }


                if(!payload.category){

                    throw new Error(
                        "Please select a category."
                    );

                }


                const endpoint =
                    wasEditing

                        ? `${API_URL}/api/admin/products/${editingProductId}`

                        : `${API_URL}/api/admin/products`;


                const method =
                    wasEditing
                        ? "PATCH"
                        : "POST";


                const response =
                    await fetch(
                        endpoint,
                        {

                            method,

                            headers:
                                adminHeaders({
                                    "Content-Type":
                                        "application/json"
                                }),

                            body:
                                JSON.stringify(
                                    payload
                                )

                        }
                    );


                const data =
                    await response.json();


                if(!response.ok){

                    throw new Error(
                        data.message ||
                        "Could not save product."
                    );

                }


                showMessage(
                    wasEditing
                        ? "Product updated successfully."
                        : "Product added successfully."
                );


                resetForm();

                await loadProducts();


            }catch(error){

                console.error(
                    error
                );

                showMessage(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );


            }finally{

                submitBtn.disabled =
                    false;

                submitBtn.textContent =
                    editingProductId
                        ? "Update Product"
                        : "Add Product";

            }

        }
    );


/* =====================================================
   LOAD ADMIN PRODUCTS
===================================================== */

async function loadProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    grid.innerHTML = `

        <div class="loading">
            Loading products...
        </div>

    `;


    try{

        const response =
            await fetch(
                `${API_URL}/api/admin/products`,
                {
                    headers:
                        adminHeaders()
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not load products."
            );

        }


        products =
            Array.isArray(data)
                ? data
                : Array.isArray(data.products)
                    ? data.products
                    : [];


        renderProducts(
            products
        );


    }catch(error){

        console.error(
            error
        );


        grid.innerHTML = `

            <div class="empty-state">

                Could not load products.

                <br><br>

                <small>
                    ${escapeHtml(
                        error.message ||
                        ""
                    )}
                </small>

                <br><br>

                <button
                    class="btn btn-primary"
                    onclick="loadProducts()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
    list
){

    const grid =
        document.getElementById(
            "productsGrid"
        );

    const count =
        document.getElementById(
            "productCount"
        );


    count.textContent =
        `${list.length} product${
            list.length === 1
                ? ""
                : "s"
        }`;


    if(!list.length){

        grid.innerHTML = `

            <div class="empty-state">
                No products found.
            </div>

        `;

        return;

    }


    grid.innerHTML =
        list.map(
            product => {

                const isActive =
                    Number(
                        product.active
                    ) === 1;


                const statusText =
                    isActive
                        ? "ACTIVE"
                        : "HIDDEN";


                const statusClass =
                    isActive
                        ? "status-active"
                        : "status-hidden";


                const stockText =
                    "Stock managed on customer checkout";


                return `

                    <article
                        class="product-card ${
                            isActive
                                ? ""
                                : "is-hidden"
                        }"
                    >

                        <div
                            class="product-image-wrap"
                        >

                            <span
                                class="status-badge ${statusClass}"
                            >
                                ${statusText}
                            </span>


                            ${
                                product.image

                                ?

                                `
                                <img
                                    src="${escapeHtml(
                                        product.image
                                    )}"
                                    alt="${escapeHtml(
                                        product.name
                                    )}"
                                    loading="lazy"
                                    onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
                                >

                                <div
                                    class="no-image"
                                    style="display:none;"
                                >
                                    ${escapeHtml(
                                        product.emoji ||
                                        "🛍️"
                                    )}
                                </div>
                                `

                                :

                                `
                                <div class="no-image">
                                    ${escapeHtml(
                                        product.emoji ||
                                        "🛍️"
                                    )}
                                </div>
                                `
                            }

                        </div>


                        <div
                            class="product-body"
                        >

                            <div
                                class="product-category"
                            >
                                ${escapeHtml(
                                    product.category ||
                                    "Product"
                                )}
                            </div>


                            <div
                                class="product-name"
                            >
                                ${escapeHtml(
                                    product.name
                                )}
                            </div>


                            <div
                                class="product-price"
                            >
                                ${formatMoney(
                                    product.price
                                )}
                            </div>


                            <div
                                class="product-description"
                            >
                                ${escapeHtml(
                                    product.description ||
                                    "No description."
                                )}
                            </div>


                            <div
                                class="product-description"
                            >
                                ${stockText}
                            </div>


                            <div
                                class="card-actions"
                            >

                                <button
                                    class="btn btn-primary btn-small"
                                    onclick="editProduct(
                                        ${Number(product.id)}
                                    )"
                                >
                                    Edit
                                </button>


                                <button
                                    class="btn btn-danger btn-small"
                                    onclick="deleteProduct(
                                        ${Number(product.id)}
                                    )"
                                >
                                    Delete
                                </button>

                            </div>


                            <button
                                class="btn btn-small visibility-btn ${
                                    isActive
                                        ? "btn-hide"
                                        : "btn-show"
                                }"
                                onclick="toggleProductVisibility(
                                    ${Number(product.id)},
                                    ${isActive}
                                )"
                            >

                                ${
                                    isActive
                                        ? "👁️ Hide Product"
                                        : "👁️ Show Product"
                                }

                            </button>

                        </div>

                    </article>

                `;

            }
        )
        .join("");

}


/* =====================================================
   SEARCH
===================================================== */

function filterProducts(){

    const query =
        document
            .getElementById(
                "searchProducts"
            )
            .value
            .toLowerCase()
            .trim();


    if(!query){

        renderProducts(
            products
        );

        return;

    }


    const filtered =
        products.filter(
            product =>

                String(
                    product.name ||
                    ""
                )
                .toLowerCase()
                .includes(
                    query
                )

                ||

                String(
                    product.category ||
                    ""
                )
                .toLowerCase()
                .includes(
                    query
                )

        );


    renderProducts(
        filtered
    );

}


/* =====================================================
   HIDE / SHOW PRODUCT
===================================================== */

async function toggleProductVisibility(
    id,
    currentlyActive
){

    const product =
        products.find(
            item =>
                Number(
                    item.id
                ) ===
                Number(id)
        );


    if(!product){

        return;

    }


    const message =
        currentlyActive

            ?

            `Hide "${product.name}"?\n\nCustomers will no longer see this product in the store.`

            :

            `Show "${product.name}"?\n\nCustomers will be able to see this product again.`;


    if(
        !confirm(message)
    ){

        return;

    }


    try{

        const response =
            await fetch(
                `${API_URL}/api/admin/products/${id}/visibility`,
                {

                    method:"PATCH",

                    headers:
                        adminHeaders({
                            "Content-Type":
                                "application/json"
                        }),

                    body:
                        JSON.stringify({
                            active:
                                currentlyActive
                                    ? 0
                                    : 1
                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not change product visibility."
            );

        }


        showMessage(
            currentlyActive
                ? "Product hidden successfully."
                : "Product is visible again."
        );


        await loadProducts();


    }catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Could not change product visibility.",
            "error"
        );

    }

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(
    id
){

    const product =
        products.find(
            item =>
                Number(
                    item.id
                ) ===
                Number(id)
        );


    if(!product){

        alert(
            "Product could not be found."
        );

        return;

    }


    editingProductId =
        Number(id);


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
        "Edit Product";


    document
        .getElementById(
            "submitBtn"
        )
        .textContent =
        "Update Product";


    document
        .getElementById(
            "cancelEditBtn"
        )
        .classList
        .remove(
            "hidden"
        );


    document
        .getElementById(
            "name"
        )
        .value =
        product.name ||
        "";


    document
        .getElementById(
            "price"
        )
        .value =
        product.price ||
        0;


    document
        .getElementById(
            "category"
        )
        .value =
        product.category ||
        "";


    document
        .getElementById(
            "emoji"
        )
        .value =
        product.emoji ||
        "";


    document
        .getElementById(
            "description"
        )
        .value =
        product.description ||
        "";


    document
        .getElementById(
            "image"
        )
        .value =
        product.image ||
        "";


    const preview =
        document.getElementById(
            "imagePreview"
        );


    if(product.image){

        preview.src =
            product.image;

        preview.style.display =
            "block";

    }else{

        preview.src = "";

        preview.style.display =
            "none";

    }


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

    resetForm();

}


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

    editingProductId =
        null;


    document
        .getElementById(
            "productForm"
        )
        .reset();


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
        "Add New Product";


    document
        .getElementById(
            "submitBtn"
        )
        .textContent =
        "Add Product";


    document
        .getElementById(
            "cancelEditBtn"
        )
        .classList
        .add(
            "hidden"
        );


    const preview =
        document.getElementById(
            "imagePreview"
        );


    preview.src = "";

    preview.style.display =
        "none";

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(
    id
){

    const product =
        products.find(
            item =>
                Number(
                    item.id
                ) ===
                Number(id)
        );


    if(!product){

        return;

    }


    const confirmed =
        confirm(
            `Delete "${product.name}"?\n\nProducts that already belong to an order cannot be deleted. You can hide them instead.`
        );


    if(!confirmed){

        return;

    }


    try{

        const response =
            await fetch(
                `${API_URL}/api/admin/products/${id}`,
                {

                    method:"DELETE",

                    headers:
                        adminHeaders()

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not delete product."
            );

        }


        showMessage(
            "Product deleted successfully."
        );


        await loadProducts();


    }catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Could not delete product.",
            "error"
        );

    }

}


/* =====================================================
   START

loadProducts();
