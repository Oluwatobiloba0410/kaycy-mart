/* =========================
   LIVE RENDER BACKEND
========================= */

const API_URL =
    "https://kaycy-backend.onrender.com";


let currentUser = null;


try{

    currentUser =
        JSON.parse(
            localStorage.getItem(
                "kaycyMartCurrentUser"
            )
        );

}catch(error){

    currentUser = null;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   MONEY
========================= */

function formatMoney(value){

    return "₦" +
        (Number(value) || 0)
        .toLocaleString("en-NG");

}


/* =========================
   DATE
========================= */

function formatDate(value){

    if(!value){
        return "Date unavailable";
    }

    let date =
        new Date(value);

    if(isNaN(date.getTime())){

        date =
            new Date(
                String(value)
                .replace(" ","T") + "Z"
            );

    }

    if(isNaN(date.getTime())){

        return escapeHTML(value);

    }

    return date.toLocaleString(
        "en-NG",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );

}


/* =========================
   MESSAGE
========================= */

function showMessage(
    title,
    text,
    buttonText,
    buttonLink
){

    const container =
        document.getElementById(
            "ordersContainer"
        );

    let button = "";

    if(buttonText && buttonLink){

        button = `
            <a
                href="${buttonLink}"
                class="shop-btn"
            >
                ${escapeHTML(buttonText)}
            </a>
        `;

    }

    container.innerHTML = `

        <div class="message">

            <h2>
                ${escapeHTML(title)}
            </h2>

            <p>
                ${escapeHTML(text)}
            </p>

            ${button}

        </div>

    `;

}


/* =========================
   TRACKING
========================= */

function createTracking(status){

    const stages = [
        "Order Received",
        "Processing",
        "Shipped",
        "Delivered"
    ];

    const currentIndex =
        stages.indexOf(status);

    if(status === "Cancelled"){

        return `

            <div class="cancelled-box">
                ❌ This order has been cancelled.
            </div>

        `;

    }

    let html = `

        <div class="tracking">

            <div class="tracking-title">
                Order Progress
            </div>

            <div class="tracking-line">

    `;


    stages.forEach(function(stage,index){

        let className = "";

        if(
            currentIndex >= 0 &&
            index < currentIndex
        ){

            className = "completed";

        }
        else if(
            currentIndex === index
        ){

            className = "active";

        }


        let icon = "";

        if(
            currentIndex >= 0 &&
            index < currentIndex
        ){

            icon = "✓";

        }
        else{

            icon = String(index + 1);

        }


        html += `

            <div class="tracking-step ${className}">

                <div class="tracking-icon">
                    ${icon}
                </div>

                <div class="tracking-label">
                    ${escapeHTML(stage)}
                </div>

            </div>

        `;

    });


    html += `

            </div>

        </div>

    `;


    return html;

}


/* =========================
   PAYMENT SECTION
========================= */

function createPaymentSection(order){

    const paymentStatus =
        order.payment_status ||
        order.paymentStatus ||
        "Payment Pending";


    const paymentReference =
        order.payment_reference ||
        order.paymentReference ||
        "";


    const paymentMethod =
        order.payment_method ||
        order.paymentMethod ||
        "";


    let statusClass =
        "payment-pending";


    if(paymentStatus === "Payment Submitted"){

        statusClass =
            "payment-submitted";

    }
    else if(paymentStatus === "Payment Confirmed"){

        statusClass =
            "payment-confirmed";

    }
    else if(paymentStatus === "Payment Failed"){

        statusClass =
            "payment-failed";

    }


    let bankDetailsHTML = "";

    let formHTML = "";


    /*
       Show OPay details for Bank Transfer orders
       while payment still needs to be made.
    */

    if(
        paymentStatus === "Payment Pending" &&
        (
            paymentMethod.toLowerCase().includes("bank") ||
            paymentMethod.toLowerCase().includes("transfer") ||
            paymentMethod === ""
        )
    ){

        bankDetailsHTML = `

            <div class="bank-details">

                <div class="bank-title">
                    🏦 Bank Transfer Details
                </div>

                <div class="bank-row">

                    <span class="bank-label">
                        Payment Method
                    </span>

                    <span class="bank-value">
                        OPay
                    </span>

                </div>

                <div class="bank-row">

                    <span class="bank-label">
                        Account Number
                    </span>

                    <span class="bank-value">
                        9151342832
                    </span>

                </div>

                <div class="bank-row">

                    <span class="bank-label">
                        Account Name
                    </span>

                    <span class="bank-value">
                        Olalusi Caleb Oluwatobiloba
                    </span>

                </div>

                <div class="payment-instruction">

                    Transfer the exact order amount to the account above.
                    After completing the transfer, enter the payment reference
                    from your OPay transaction below.

                </div>

            </div>

        `;

    }


    if(paymentStatus === "Payment Pending"){

        formHTML = `

            <div class="payment-form">

                <label
                    for="paymentRef-${escapeHTML(order.id)}"
                >
                    Payment Reference
                </label>

                <input
                    type="text"
                    class="payment-input"
                    id="paymentRef-${escapeHTML(order.id)}"
                    placeholder="Enter your OPay payment reference"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="payment-submit"
                    id="paymentBtn-${escapeHTML(order.id)}"
                    onclick="submitPayment('${escapeHTML(order.id)}')"
                >
                    💳 I've Made Payment
                </button>

                <div class="payment-note">

                    Only submit this after you have completed
                    the transfer.

                </div>

            </div>

        `;

    }


    else if(paymentStatus === "Payment Submitted"){

        formHTML = `

            <div class="payment-note">

                Your payment reference has been submitted.
                Please wait while the administrator verifies
                your payment.

            </div>

        `;

    }


    else if(paymentStatus === "Payment Confirmed"){

        formHTML = `

            <div class="payment-note">

                ✅ Your payment has been verified successfully.

            </div>

        `;

    }


    else if(paymentStatus === "Payment Failed"){

        formHTML = `

            <div class="payment-note">

                ❌ Your payment could not be verified.
                Please contact Kaycy Mart if you believe
                this is an error.

            </div>

        `;

    }


    return `

        <div class="payment-box">

            <div class="payment-title">
                💳 Payment
            </div>

            <span class="payment-status ${statusClass}">
                ${escapeHTML(paymentStatus)}
            </span>


            ${
                paymentReference
                ? `

                    <div class="payment-reference">

                        <strong>
                            Payment Reference:
                        </strong>

                        ${escapeHTML(paymentReference)}

                    </div>

                  `
                : ""
            }


            ${bankDetailsHTML}

            ${formHTML}

        </div>

    `;

}


/* =========================
   SUBMIT PAYMENT
========================= */

async function submitPayment(orderId){

    if(!currentUser){

        alert(
            "Please login again."
        );

        return;

    }


    const input =
        document.getElementById(
            "paymentRef-" + orderId
        );


    const button =
        document.getElementById(
            "paymentBtn-" + orderId
        );


    if(!input || !button){

        return;

    }


    const reference =
        input.value.trim();


    if(!reference){

        alert(
            "Please enter your payment reference."
        );

        input.focus();

        return;

    }


    button.disabled = true;

    button.textContent =
        "Submitting...";


    try{

        const response =
            await fetch(

                API_URL +
                "/api/orders/" +
                encodeURIComponent(orderId) +
                "/payment",

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userId:
                                Number(
                                    currentUser.id
                                ),

                            paymentReference:
                                reference

                        })

                }

            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to submit payment."
            );

        }


        alert(
            "✅ Payment reference submitted successfully."
        );


        await loadOrders();

    }
    catch(error){

        console.error(
            "Payment submission error:",
            error
        );


        alert(
            "❌ " +
            (
                error.message ||
                "Unable to submit payment."
            )
        );


        button.disabled = false;

        button.textContent =
            "💳 I've Made Payment";

    }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    if(!currentUser){

        showMessage(

            "Please Login",

            "You need to login to view your orders.",

            "Login",

            "Login.html"

        );

        return;

    }


    if(
        currentUser.id === undefined ||
        currentUser.id === null ||
        currentUser.id === ""
    ){

        showMessage(

            "Account Information Missing",

            "Please login again so we can identify your account.",

            "Login Again",

            "Login.html"

        );

        return;

    }


    container.innerHTML = `

        <div class="message">

            <h2>
                Loading Orders...
            </h2>

            <p>
                Please wait.
            </p>

        </div>

    `;


    try{

        const response =
            await fetch(

                API_URL +
                "/api/orders?userId=" +
                encodeURIComponent(
                    Number(currentUser.id)
                )

            );


        const data =
            await response.json();


        console.log(
            "Orders API response:",
            data
        );


        if(!response.ok){

            throw new Error(

                data.message ||
                "Unable to load your orders."

            );

        }


        let orders = [];


        if(Array.isArray(data)){

            orders = data;

        }
        else if(
            data &&
            Array.isArray(data.orders)
        ){

            orders =
                data.orders;

        }


        if(!orders.length){

            showMessage(

                "No Orders Yet 🛒",

                "You haven't placed any orders yet.",

                "Start Shopping",

                "Products.html"

            );

            return;

        }


        container.innerHTML =
            orders
                .map(function(order){

                    return createOrderCard(
                        order
                    );

                })
                .join("");

    }
    catch(error){

        console.error(
            "Orders error:",
            error
        );


        showMessage(

            "Unable to Load Orders",

            error.message ||
            "Something went wrong while loading your orders."

        );

    }

}


/* =========================
   ORDER CARD
========================= */

function createOrderCard(order){

    const orderNumber =
        order.order_number ||
        order.orderNumber ||
        order.id ||
        "Unknown";


    const status =
        order.status ||
        "Order Received";


    const paymentMethod =
        order.payment_method ||
        order.paymentMethod ||
        "Not specified";


    const city =
        order.city ||
        "Not specified";


    const address =
        order.delivery_address ||
        order.deliveryAddress ||
        "Not specified";


    const customerName =
        order.customer_name ||
        order.customerName ||
        currentUser.name ||
        "Customer";


    const createdAt =
        order.created_at ||
        order.createdAt ||
        "";


    const total =
        Number(order.total) || 0;


    let items = [];


    if(Array.isArray(order.items)){

        items =
            order.items;

    }
    else if(
        Array.isArray(order.order_items)
    ){

        items =
            order.order_items;

    }


    let itemsHTML = "";


    if(items.length){

        itemsHTML =
            items.map(function(item){

                const name =
                    item.product_name ||
                    item.productName ||
                    item.name ||
                    "Product";


                const quantity =
                    Number(item.quantity) || 1;


                const price =
                    Number(item.price) || 0;


                return `

                    <div class="item">

                        <div>

                            <div class="item-name">
                                ${escapeHTML(name)}
                            </div>

                            <div class="item-quantity">
                                Quantity: ${quantity}
                            </div>

                        </div>


                        <div class="item-total">

                            ${formatMoney(
                                price * quantity
                            )}

                        </div>

                    </div>

                `;

            }).join("");

    }
    else{

        itemsHTML = `

            <div class="item">

                <div class="item-name">
                    Order items
                </div>

                <div class="item-total">
                    ${formatMoney(total)}
                </div>

            </div>

        `;

    }


    return `

        <div class="order-card">

            <div class="order-top">

                <div>

                    <div class="order-number">

                        Order #
                        ${escapeHTML(
                            orderNumber
                        )}

                    </div>


                    <div class="order-date">

                        ${formatDate(
                            createdAt
                        )}

                    </div>

                </div>


                <div class="status">

                    ${escapeHTML(
                        status
                    )}

                </div>

            </div>


            ${createTracking(status)}


            ${createPaymentSection(order)}


            <div class="details">

                <div class="detail">

                    <div class="detail-label">
                        Customer
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            customerName
                        )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Payment Method
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            paymentMethod
                        )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        City
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            city
                        )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Delivery Address
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            address
                        )}

                    </div>

                </div>

            </div>


            <h3 class="items-title">
                Ordered Products
            </h3>


            <div>

                ${itemsHTML}

            </div>


            <div class="total">

                <span>
                    Total
                </span>

                <span class="total-amount">

                    ${formatMoney(
                        total
                    )}

                </span>

            </div>

        </div>

    `;

}


loadOrders();

</script></body>
</html>
