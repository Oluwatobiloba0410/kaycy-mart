<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users | Kaycy Mart Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    color:#111827;
}

/* =========================
   HEADER
========================= */

header{
    background:#111827;
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:21px;
    font-weight:800;
}

.logo-icon{
    width:38px;
    height:38px;
    background:#f59e0b;
    color:#111827;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.admin-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.admin-badge{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#e5e7eb;
}

.admin-dot{
    width:8px;
    height:8px;
    background:#22c55e;
    border-radius:50%;
}

.logout{
    background:#f59e0b;
    color:#111827;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.logout:hover{
    background:#d97706;
    transform:translateY(-1px);
}

/* =========================
   NAVIGATION
========================= */

nav{
    background:#1f2937;
    padding:9px 20px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    border-bottom:1px solid #374151;
}

nav a{
    color:#d1d5db;
    text-decoration:none;
    padding:9px 14px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

nav a:hover{
    background:#374151;
    color:white;
}

nav a.active{
    background:#f59e0b;
    color:#111827;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:1250px;
    margin:0 auto;
    padding:28px 18px 50px;
}

/* =========================
   PAGE TITLE
========================= */

.page-heading{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:24px;
}

.page-title h1{
    font-size:29px;
    margin-bottom:7px;
    letter-spacing:-.4px;
}

.page-title p{
    color:#6b7280;
    font-size:14px;
}

/* =========================
   ERROR
========================= */

.error{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
    padding:14px 16px;
    border-radius:10px;
    margin-bottom:20px;
    display:none;
    font-size:14px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:22px;
}

.stat-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 12px rgba(17,24,39,.06);
    position:relative;
    overflow:hidden;
}

.stat-card::after{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    right:-20px;
    top:-20px;
    background:#f59e0b;
    opacity:.08;
    border-radius:50%;
}

.stat-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
}

.stat-icon{
    width:40px;
    height:40px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff7ed;
    font-size:19px;
}

.stat-card h3{
    font-size:13px;
    color:#6b7280;
    font-weight:700;
    margin-bottom:5px;
}

.stat-card strong{
    display:block;
    font-size:27px;
    color:#111827;
}

/* =========================
   SEARCH
========================= */

.search-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(17,24,39,.05);
}

.search-label{
    display:block;
    font-size:13px;
    font-weight:800;
    color:#374151;
    margin-bottom:9px;
}

.search-wrap{
    position:relative;
}

.search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    font-size:17px;
    pointer-events:none;
}

.search-box input{
    width:100%;
    padding:13px 15px 13px 43px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:14px;
    outline:none;
    background:#fafafa;
    transition:.2s;
}

.search-box input:focus{
    border-color:#f59e0b;
    background:white;
    box-shadow:0 0 0 3px rgba(245,158,11,.12);
}

/* =========================
   USERS CARD
========================= */

.table-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    box-shadow:0 3px 14px rgba(17,24,39,.06);
    overflow:hidden;
}

.table-header{
    padding:18px 20px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.table-heading h2{
    font-size:18px;
    margin-bottom:4px;
}

.table-heading p{
    color:#9ca3af;
    font-size:12px;
}

.refresh-btn{
    background:#111827;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
    transition:.2s;
}

.refresh-btn:hover{
    background:#374151;
    transform:translateY(-1px);
}

/* =========================
   TABLE
========================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

th,
td{
    padding:14px 16px;
    text-align:left;
    border-bottom:1px solid #eef0f3;
    font-size:13px;
}

th{
    background:#f9fafb;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:#6b7280;
    font-weight:800;
}

tbody tr{
    transition:.15s;
}

tbody tr:hover td{
    background:#fffbf5;
}

tbody tr:last-child td{
    border-bottom:none;
}

.user-id{
    color:#9ca3af;
    font-weight:700;
}

.user-name{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:170px;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#111827;
    color:#f59e0b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:13px;
    flex-shrink:0;
}

.user-name strong{
    color:#111827;
    font-size:13px;
}

.email{
    color:#4b5563;
}

.phone{
    color:#4b5563;
}

/* =========================
   ROLE
========================= */

.role{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.role::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:currentColor;
}

.role.admin{
    background:#fef3c7;
    color:#92400e;
}

.role.customer{
    background:#eef2ff;
    color:#4338ca;
}

/* =========================
   STATES
========================= */

.empty,
.loading{
    text-align:center;
    padding:45px 20px !important;
    color:#6b7280;
}

.empty{
    font-size:14px;
}

.loading{
    font-size:14px;
}

/* =========================
   MOBILE USER CARDS
========================= */

.mobile-users{
    display:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .page-heading{
        align-items:flex-start;
    }

}

@media(max-width:650px){

    header{
        padding:13px 14px;
    }

    .logo{
        font-size:18px;
    }

    .logo-icon{
        width:35px;
        height:35px;
    }

    .admin-info{
        width:100%;
        justify-content:space-between;
    }

    nav{
        padding:8px;
        gap:5px;
    }

    nav a{
        flex:1;
        text-align:center;
        padding:9px 7px;
        font-size:12px;
    }

    .container{
        padding:21px 12px 40px;
    }

    .page-title h1{
        font-size:24px;
    }

    .page-title p{
        font-size:13px;
        line-height:1.5;
    }

    .stats{
        gap:11px;
    }

    .stat-card{
        padding:16px;
    }

    .stat-card strong{
        font-size:24px;
    }

    .table-header{
        padding:16px;
        align-items:stretch;
        flex-direction:column;
    }

    .refresh-btn{
        width:100%;
    }

    .table-wrap{
        overflow-x:auto;
    }
}

@media(max-width:450px){

    .admin-badge{
        font-size:12px;
    }

    .logout{
        padding:9px 12px;
        font-size:12px;
    }

    nav a{
        font-size:11px;
    }

}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">

        <div class="logo-icon">
            🛒
        </div>

        <span>
            Kaycy Mart
        </span>

    </div>

    <div class="admin-info">

        <div class="admin-badge">

            <span class="admin-dot"></span>

            <span id="adminName">
                Admin
            </span>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

    <a href="Admin-Dashboard.html">
        📊 Dashboard
    </a>

    <a href="Admin-Products.html">
        📦 Products
    </a>

    <a
        href="Admin-Users.html"
        class="active"
    >
        👥 Users
    </a>

</nav>


<!-- =========================
     MAIN
========================= -->

<div class="container">

    <div class="page-heading">

        <div class="page-title">

            <h1>
                👥 Users
            </h1>

            <p>
                Manage and view registered customers and administrators.
            </p>

        </div>

    </div>


    <!-- ERROR -->

    <div
        class="error"
        id="errorMessage"
    ></div>


    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-top">

                <div>

                    <h3>
                        Total Users
                    </h3>

                    <strong id="totalUsers">
                        0
                    </strong>

                </div>

                <div class="stat-icon">
                    👥
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <div>

                    <h3>
                        Customers
                    </h3>

                    <strong id="totalCustomers">
                        0
                    </strong>

                </div>

                <div class="stat-icon">
                    🛍️
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <div>

                    <h3>
                        Administrators
                    </h3>

                    <strong id="totalAdmins">
                        0
                    </strong>

                </div>

                <div class="stat-icon">
                    🛡️
                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="search-card">

        <label
            class="search-label"
            for="searchInput"
        >
            Search Users
        </label>

        <div class="search-wrap">

            <span class="search-icon">
                🔎
            </span>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, email or phone..."
                    oninput="filterUsers()"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         USERS TABLE
    ========================= -->

    <div class="table-card">

        <div class="table-header">

            <div class="table-heading">

                <h2>
                    Registered Users
                </h2>

                <p>
                    All users currently registered on Kaycy Mart
                </p>

            </div>

            <button
                class="refresh-btn"
                onclick="loadUsers()"
            >
                🔄 Refresh Users
            </button>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            User
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Registered
                        </th>

                    </tr>

                </thead>


                <tbody id="usersTable">

                    <tr>

                        <td
                            colspan="6"
                            class="loading"
                        >
                            Loading users...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================
   API
========================= */

const API_URL =
    "https://kaycy-backend.onrender.com";

let allUsers = [];


/* =========================
   ADMIN SESSION CHECK
========================= */

const adminLoggedIn =
    localStorage.getItem(
        "kaycyMartAdminLoggedIn"
    );

const adminData =
    localStorage.getItem(
        "kaycyMartAdmin"
    );


if(
    adminLoggedIn !== "true" ||
    !adminData
){

    window.location.href =
        "Admin-Login.html";

}else{

    try{

        const admin =
            JSON.parse(adminData);

        if(
            admin.role !== "admin"
        ){

            throw new Error(
                "Not an admin"
            );
        }

        document.getElementById(
            "adminName"
        ).textContent =
            admin.name || "Admin";

    }catch(error){

        localStorage.removeItem(
            "kaycyMartAdminLoggedIn"
        );

        localStorage.removeItem(
            "kaycyMartAdmin"
        );

        window.location.href =
            "Admin-Login.html";
    }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   USER INITIAL
========================= */

function getInitial(name){

    const clean =
        String(name || "U").trim();

    if(!clean){
        return "U";
    }

    return clean
        .charAt(0)
        .toUpperCase();
}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    const table =
        document.getElementById(
            "usersTable"
        );

    const errorBox =
        document.getElementById(
            "errorMessage"
        );

    errorBox.style.display =
        "none";

    table.innerHTML = `
        <tr>
            <td
                colspan="6"
                class="loading"
            >
                Loading users...
            </td>
        </tr>
    `;

    try{

        const admin =
            JSON.parse(
                localStorage.getItem(
                    "kaycyMartAdmin"
                )
            );

        if(
            !admin ||
            admin.role !== "admin"
        ){

            throw new Error(
                "Admin session is invalid."
            );
        }


        const response =
            await fetch(
                API_URL +
                "/api/admin/users",
                {
                    method:"GET",

                    headers:{
                        "x-admin-user-id":
                            String(admin.id)
                    }
                }
            );


        const data =
            await response.json()
            .catch(() => ({}));


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Failed to load users."
            );
        }


        /*
          Backend may return:

          [users]

          OR:

          { users:[users] }
        */

        allUsers =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.users
                    )
                    ? data.users
                    : []
                );


        updateStats();

        displayUsers(
            allUsers
        );


    }catch(error){

        console.error(error);

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    ❌ Unable to load users.
                </td>
            </tr>
        `;

        errorBox.textContent =
            "❌ " +
            (
                error.message ||
                "Failed to load users."
            );

        errorBox.style.display =
            "block";
    }
}


/* =========================
   UPDATE STATS
========================= */

function updateStats(){

    const total =
        allUsers.length;


    const customers =
        allUsers.filter(
            user =>
                (
                    user.role ||
                    "customer"
                )
                .toLowerCase()
                === "customer"
        ).length;


    const admins =
        allUsers.filter(
            user =>
                (
                    user.role ||
                    ""
                )
                .toLowerCase()
                === "admin"
        ).length;


    document.getElementById(
        "totalUsers"
    ).textContent =
        total;


    document.getElementById(
        "totalCustomers"
    ).textContent =
        customers;


    document.getElementById(
        "totalAdmins"
    ).textContent =
        admins;
}


/* =========================
   DISPLAY USERS
========================= */

function displayUsers(users){

    const table =
        document.getElementById(
            "usersTable"
        );


    if(!users.length){

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    No users found.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        users.map(
            user => {

                const role =
                    String(
                        user.role ||
                        "customer"
                    ).toLowerCase();


                const roleClass =
                    role === "admin"
                        ? "admin"
                        : "customer";


                const registered =
                    user.created_at
                        ? new Date(
                            user.created_at
                        ).toLocaleDateString(
                            undefined,
                            {
                                year:"numeric",
                                month:"short",
                                day:"numeric"
                            }
                        )
                        : "—";


                return `
                    <tr>

                        <td>
                            <span class="user-id">
                                #${escapeHTML(
                                    user.id
                                )}
                            </span>
                        </td>


                        <td>

                            <div class="user-name">

                                <div class="avatar">
                                    ${escapeHTML(
                                        getInitial(
                                            user.name
                                        )
                                    )}
                                </div>

                                <strong>
                                    ${escapeHTML(
                                        user.name ||
                                        "Unnamed User"
                                    )}
                                </strong>

                            </div>

                        </td>


                        <td>

                            <span class="email">
                                ${escapeHTML(
                                    user.email
                                )}
                            </span>

                        </td>


                        <td>

                            <span class="phone">
                                ${escapeHTML(
                                    user.phone ||
                                    "—"
                                )}
                            </span>

                        </td>


                        <td>

                            <span
                                class="role ${roleClass}"
                            >
                                ${escapeHTML(
                                    role
                                        .charAt(0)
                                        .toUpperCase()
                                    +
                                    role.slice(1)
                                )}
                            </span>

                        </td>


                        <td>

                            ${escapeHTML(
                                registered
                            )}

                        </td>

                    </tr>
                `;

            }
        ).join("");
}


/* =========================
   SEARCH USERS
========================= */

function filterUsers(){

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if(!search){

        displayUsers(
            allUsers
        );

        return;
    }


    const filtered =
        allUsers.filter(
            user => {

                const name =
                    String(
                        user.name || ""
                    ).toLowerCase();


                const email =
                    String(
                        user.email || ""
                    ).toLowerCase();


                const phone =
                    String(
                        user.phone || ""
                    ).toLowerCase();


                return (
                    name.includes(search) ||
                    email.includes(search) ||
                    phone.includes(search)
                );
            }
        );


    displayUsers(
        filtered
    );
}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "kaycyMartAdminLoggedIn"
    );

    localStorage.removeItem(
        "kaycyMartAdmin"
    );

    window.location.href =
        "Admin-Login.html";
}


/* =========================
   START
========================= */

loadUsers();

</script>

</body>
</html>
