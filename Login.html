<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Kaycy Mart</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #111827;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        background: #111827;
        color: white;
        padding: 16px 20px;
    }

    .header-container {
        max-width: 1100px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        color: white;
        text-decoration: none;
        font-size: 22px;
        font-weight: bold;
    }

    nav {
        display: flex;
        gap: 18px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 14px;
    }

    nav a:hover {
        color: #f59e0b;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 35px 30px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .login-card h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #111827;
        font-size: 30px;
    }

    .subtitle {
        text-align: center;
        color: #6b7280;
        margin-bottom: 28px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
        color: #374151;
    }

    .form-group input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        background: white;
    }

    .form-group input:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.12);
    }

    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 50px;
    }

    .eye-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 19px;
        color: #6b7280;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .eye-btn:hover {
        color: #111827;
    }

    .forgot {
        text-align: right;
        margin-top: -6px;
        margin-bottom: 20px;
    }

    .forgot a {
        color: #d97706;
        text-decoration: none;
        font-size: 14px;
    }

    .forgot a:hover {
        text-decoration: underline;
    }

    .login-btn {
        display: block;
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 8px;
        background: #f59e0b;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-btn:hover {
        background: #d97706;
    }

    .login-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    #message {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
    }

    .error {
        display: block !important;
        background: #fee2e2;
        color: #b91c1c;
    }

    .success {
        display: block !important;
        background: #dcfce7;
        color: #166534;
    }

    .register-area {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
        text-align: center;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
    }

    .register-text {
        color: #6b7280;
        font-size: 14px;
        display: inline;
    }

    .register-link {
        color: #d97706;
        font-weight: bold;
        text-decoration: none;
        margin-left: 5px;
    }

    .register-link:hover {
        text-decoration: underline;
    }

    footer {
        background: #111827;
        color: #d1d5db;
        text-align: center;
        padding: 18px;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        header {
            padding: 15px;
        }

        .header-container {
            flex-direction: column;
            gap: 12px;
        }

        nav {
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        main {
            padding: 25px 15px;
            align-items: flex-start;
        }

        .login-card {
            margin-top: 20px;
            padding: 28px 20px;
        }

        .login-card h1 {
            font-size: 26px;
        }
    }
</style>

</head><body><header>
    <div class="header-container">    <a href="Index.html" class="logo">
        🛒 Kaycy Mart
    </a>

    <nav>
        <a href="Index.html">Home</a>
        <a href="Products.html">Products</a>
        <a href="Cart.html">Cart</a>
        <a href="About.html">About</a>
        <a href="Contact.html">Contact</a>
    </nav>

</div>

</header><main><div class="login-card">

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to your Kaycy Mart account
    </p>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="eye-btn"
                    id="eyeBtn"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>

        </div>

        <div class="forgot">

            <a href="Forgot-Password.html">
                Forgot Password?
            </a>

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login
        </button>

        <div id="message"></div>

    </form>

    <div class="register-area">

        <span class="register-text">
            Don't have an account?
        </span>

        <a
            href="Register.html"
            class="register-link"
        >
            Register
        </a>

    </div>

</div>

</main><footer>
    © 2026 Kaycy Mart. All Rights Reserved.
</footer><script>

    /* ==============================
       LIVE BACKEND
    ============================== */

    const API_URL =
        "https://kaycy-backend.onrender.com";


    /* ==============================
       PASSWORD SHOW / HIDE
    ============================== */

    const passwordInput =
        document.getElementById("password");

    const eyeBtn =
        document.getElementById("eyeBtn");

    eyeBtn.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            eyeBtn.textContent = "🙈";

            eyeBtn.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            passwordInput.type = "password";

            eyeBtn.textContent = "👁";

            eyeBtn.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    });


    /* ==============================
       LOGIN
    ============================== */

    const loginForm =
        document.getElementById("loginForm");

    const loginBtn =
        document.getElementById("loginBtn");

    const message =
        document.getElementById("message");


    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            message.className = "";

            message.textContent = "";

            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        API_URL + "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Invalid email or password."
                    );

                }


                /* ==============================
                   SAVE LOGIN
                ============================== */

                const loggedInUser = {

                    id: data.user.id,

                    name: data.user.name,

                    email: data.user.email,

                    phone:
                        data.user.phone || "",

                    role:
                        data.user.role ||
                        "customer"

                };


                localStorage.setItem(
                    "kaycyMartLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "kaycyMartCurrentUser",
                    JSON.stringify(
                        loggedInUser
                    )
                );


                /* ==============================
                   SUCCESS
                ============================== */

                message.className =
                    "success";

                message.textContent =
                    "Login successful! Redirecting...";


                setTimeout(function () {

                    window.location.href =
                        "Account.html";

                }, 800);


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                message.className =
                    "error";

                message.textContent =
                    error.message ||
                    "Unable to login. Please try again.";

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

            }

        }
    );

</script></body>
</html>
