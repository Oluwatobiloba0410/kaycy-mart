</p></footer><script>

const API_URL = "https://kaycy-backend.onrender.com";

let products = [];

let currentCategory = "all";


/* ===============================
   LOAD CART
================================ */

function loadCart(){

    try{

        const savedCart =
            localStorage.getItem("kaycyMartCart");

        if(!savedCart){

            return [];

        }

        const parsedCart =
            JSON.parse(savedCart);

        if(!Array.isArray(parsedCart)){

            return [];

        }

        return parsedCart;

    }

    catch(error){

        console.error(
            "Cart loading error:",
            error
        );

        return [];

    }

}


let cart = loadCart();


/* ===============================
   SAVE CART
================================ */

function saveCart(){

    try{

        localStorage.setItem(
            "kaycyMartCart",
            JSON.stringify(cart)
        );

        localStorage.setItem(
            "kaycyMartCartBackup",
            JSON.stringify(cart)
        );

        return true;

    }

    catch(error){

        console.error(
            "Cart saving error:",
            error
        );

        return false;

    }

}


/* ===============================
   CART COUNT
================================ */

function updateCartCount(){

    let totalItems = 0;

    cart.forEach(function(item){

        totalItems +=
            Number(item.quantity) || 0;

    });

    document.getElementById(
        "cartCount"
    ).textContent = totalItems;

}


/* ===============================
   ADD TO CART
================================ */

function addToCart(
    productId,
    productName,
    productPrice
){

    const existingProduct =
        cart.find(function(item){

            return Number(item.productId) ===
                Number(productId);

        });


    if(existingProduct){

        existingProduct.quantity =
            Number(existingProduct.quantity) + 1;

    }

    else{

        cart.push({

            productId:Number(productId),

            name:String(productName),

            price:Number(productPrice),

            quantity:1

        });

    }


    const saved =
        saveCart();


    if(!saved){

        alert(
            "Sorry, your cart could not be saved."
        );

        return;

    }


    updateCartCount();


    alert(
        productName +
        " has been added to your cart! 🛒"
    );

}


/* ===============================
   FORMAT PRICE
================================ */

function formatPrice(price){

    return "₦" +
        Number(price).toLocaleString();

}


/* ===============================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

    const container =
        document.getElementById(
            "productContainer"
        );

    try{

        const response =
            await fetch(
                API_URL +
                "/api/products"
            );


        if(!response.ok){

            throw new Error(
                "Could not load products."
            );

        }


        products =
            await response.json();


        renderProducts();

    }

    catch(error){

        console.error(error);


        container.innerHTML = `

            <div class="product-error">

                Unable to load products.

                <br><br>

                Please make sure the
                Kaycy Mart backend is running.

            </div>

        `;

    }

}


/* ===============================
   RENDER PRODUCTS
================================ */

function renderProducts(){

    const container =
        document.getElementById(
            "productContainer"
        );


    container.innerHTML = "";


    let filteredProducts =
        products.filter(
            function(product){

                if(
                    currentCategory ===
                    "all"
                ){

                    return true;

                }


                return String(
                    product.category || ""
                ).toLowerCase().trim() ===
                    currentCategory;

            }
        );


    if(filteredProducts.length === 0){

        noResults.style.display =
            "block";

        return;

    }


    noResults.style.display =
        "none";


    filteredProducts.forEach(
        function(product){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product";


            card.dataset.category =
                String(
                    product.category || ""
                );


            card.dataset.name =
                String(
                    product.name || ""
                );


            const emoji =
                product.emoji || "🛒";


            let imageHTML = "";


            if(product.image){

                imageHTML = `

                    <img
                        src="${escapeHTML(product.image)}"
                        alt="${escapeHTML(product.name)}"
                        onerror="this.style.display='none';"
                    >

                `;

            }

            else{

                imageHTML =
                    escapeHTML(emoji);

            }


            card.innerHTML = `

                <div class="product-image">

                    ${imageHTML}

                </div>

                <div class="product-info">

                    <h3>
                        ${escapeHTML(product.name)}
                    </h3>

                    <div class="category">

                        ${escapeHTML(
                            capitalize(
                                product.category
                            )
                        )}

                    </div>

                    ${
                        product.description
                        ?
                        `
                        <div class="description">
                            ${escapeHTML(
                                product.description
                            )}
                        </div>
                        `
                        :
                        ""
                    }

                    <div class="price">

                        ${formatPrice(
                            product.price
                        )}

                    </div>

                    <button
                        class="cart-btn"
                        onclick="addToCart(
                            ${Number(product.id)},
                            '${escapeQuotes(product.name)}',
                            ${Number(product.price)}
                        )"
                    >

                        Add to Cart

                    </button>

                </div>

            `;


            container.appendChild(card);

        }
    );


    applyCurrentSearch();

}


/* ===============================
   CAPITALIZE
================================ */

function capitalize(text){

    if(!text){

        return "";

    }

    text =
        String(text).trim();


    return text.charAt(0).toUpperCase() +
        text.slice(1);

}


/* ===============================
   HTML ESCAPE
================================ */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ===============================
   ESCAPE QUOTES
================================ */

function escapeQuotes(text){

    return String(text || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}


/* ===============================
   SEARCH ELEMENTS
================================ */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const suggestions =
    document.getElementById(
        "suggestions"
    );

const searchStatus =
    document.getElementById(
        "searchStatus"
    );

const noResults =
    document.getElementById(
        "noResults"
    );


/* ===============================
   LIVE SEARCH
================================ */

searchInput.addEventListener(
    "input",
    function(){

        const searchText =
            this.value
            .toLowerCase()
            .trim();


        suggestions.innerHTML = "";


        if(searchText === ""){

            suggestions.style.display =
                "none";

            searchStatus.style.display =
                "none";

            renderProducts();

            return;

        }


        applyCurrentSearch();


        const matches =
            products.filter(
                function(product){

                    const name =
                        String(
                            product.name || ""
                        ).toLowerCase();


                    return name.includes(
                        searchText
                    );

                }
            );


        if(matches.length > 0){

            matches.forEach(
                function(product){

                    const suggestion =
                        document.createElement(
                            "div"
                        );


                    suggestion.className =
                        "suggestion";


                    suggestion.innerHTML = `

                        <strong>
                            ${escapeHTML(
                                product.name
                            )}
                        </strong>

                        <span>
                            ${formatPrice(
                                product.price
                            )}
                        </span>

                    `;


                    suggestion.onclick =
                        function(){

                            searchInput.value =
                                product.name;


                            suggestions.style.display =
                                "none";


                            applySearch(
                                product.name
                            );

                        };


                    suggestions.appendChild(
                        suggestion
                    );

                }
            );


            suggestions.style.display =
                "block";

        }

        else{

            suggestions.style.display =
                "none";

        }

    }
);


/* ===============================
   SEARCH BUTTON
================================ */

function searchProducts(){

    const text =
        searchInput.value.trim();


    if(text === ""){

        searchInput.focus();

        return;

    }


    applySearch(text);

}


/* ===============================
   APPLY SEARCH
================================ */

function applySearch(text){

    searchInput.value =
        text;


    suggestions.style.display =
        "none";


    const searchText =
        text.toLowerCase().trim();


    const cards =
        document.querySelectorAll(
            ".product"
        );


    let visibleMatches = 0;


    cards.forEach(
        function(card){

            const name =
                String(
                    card.dataset.name || ""
                ).toLowerCase();


            const category =
                String(
                    card.dataset.category || ""
                ).toLowerCase().trim();


            const matchesSearch =
                name.includes(
                    searchText
                );


            const matchesCategory =
                currentCategory === "all" ||
                category === currentCategory;


            if(
                matchesSearch &&
                matchesCategory
            ){

                card.style.display =
                    "block";

                visibleMatches++;

            }

            else{

                card.style.display =
                    "none";

            }

        }
    );


    if(visibleMatches === 0){

        noResults.style.display =
            "block";


        searchStatus.style.display =
            "block";


        searchStatus.textContent =
            "No products found for \"" +
            text +
            "\".";

    }

    else{

        noResults.style.display =
            "none";


        searchStatus.style.display =
            "block";


        searchStatus.textContent =
            visibleMatches +
            " product" +
            (
                visibleMatches === 1
                ? ""
                : "s"
            ) +
            " found for \"" +
            text +
            "\".";

    }

}


/* ===============================
   APPLY CURRENT SEARCH
================================ */

function applyCurrentSearch(){

    const text =
        searchInput.value.trim();


    if(text !== ""){

        applySearch(text);

    }

}


/* ===============================
   CATEGORY FILTER
================================ */

function filterProducts(
    category,
    button
){

    currentCategory =
        category;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            function(btn){

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    searchInput.value =
        "";


    suggestions.style.display =
        "none";


    searchStatus.style.display =
        "none";


    noResults.style.display =
        "none";


    renderProducts();

}


/* ===============================
   HOMEPAGE SEARCH
================================ */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const searchFromHome =
    urlParams.get("search");


/* ===============================
   CLOSE SUGGESTIONS
================================ */

document.addEventListener(
    "click",
    function(event){

        if(
            !event.target.closest(
                ".search-box"
            )
        ){

            suggestions.style.display =
                "none";

        }

    }
);


/* ===============================
   INITIALIZE
================================ */

updateCartCount();

loadProducts();


if(searchFromHome){

    searchInput.value =
        searchFromHome;

}

</script></body>
