<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Products | Kaycy Mart</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #111827;
}

/* HEADER */
header {
    background: #111827;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #f59e0b;
}

.admin-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.admin-name {
    font-size: 14px;
}

.logout-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.logout-btn:hover {
    background: #b91c1c;
}

/* NAVIGATION */
nav {
    background: #1f2937;
    padding: 12px 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #f59e0b;
}

/* CONTAINER */
.container {
    width: 95%;
    max-width: 1200px;
    margin: 25px auto;
}

/* PAGE TITLE */
.page-title {
    margin-bottom: 20px;
}

.page-title h1 {
    font-size: 28px;
    margin-bottom: 6px;
}

.page-title p {
    color: #6b7280;
}

/* FORM CARD */
.form-card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.form-card h2 {
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #f59e0b;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.form-buttons {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #111827;
    color: white;
}

.btn-primary:hover {
    background: #1f2937;
}

.btn-secondary {
    background: #6b7280;
    color: white;
}

.btn-secondary:hover {
    background: #4b5563;
}

/* MESSAGE */
#message {
    display: none;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 18px;
    font-weight: bold;
}

#message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

#message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

/* PRODUCTS */
.products-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
    flex-wrap: wrap;
}

.products-header h2 {
    font-size: 22px;
}

.refresh-btn {
    background: #f59e0b;
    color: #111827;
    border: none;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn:hover {
    background: #d97706;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.product-image {
    height: 190px;
    background: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 70px;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 16px;
}

.product-info h3 {
    margin-bottom: 8px;
    font-size: 19px;
}

.product-category {
    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 10px;
}

.product-price {
    font-size: 19px;
    font-weight: bold;
    color: #d97706;
    margin-bottom: 8px;
}

.product-description {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
    min-height: 42px;
}

.product-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.edit-btn {
    flex: 1;
    background: #2563eb;
    color: white;
}

.edit-btn:hover {
    background: #1d4ed8;
}

.delete-btn {
    flex: 1;
    background: #dc2626;
    color: white;
}

.delete-btn:hover {
    background: #b91c1c;
}

/* LOADING */
.loading {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

/* MOBILE */
@media (max-width: 900px) {
    .product-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {
    header {
        align-items: flex-start;
    }

    .admin-info {
        width: 100%;
        justify-content: space-between;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .product-grid {
        grid-template-columns: 1fr;
    }

    .container {
        width: 92%;
    }

    nav {
        gap: 14px;
    }

    .page-title h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🛒 Kaycy Mart</div>

    <div class="admin-info">
        <span class="admin-name" id="adminName">Admin</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>

<nav>
    <a href="Admin-Dashboard.html">Dashboard</a>
    <a href="Admin-Products.html">Products</a>
    <a href="Admin-Users.html">Users</a>
</nav>

<div class="container">

    <div class="page-title">
        <h1>Manage Products</h1>
        <p>Add, edit and remove products from Kaycy Mart.</p>
    </div>

    <div id="message"></div>

    <!-- PRODUCT FORM -->
    <div class="form-card">
        <h2 id="formTitle">Add New Product</h2>

        <form id="productForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (₦)</label>
                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Enter price"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productCategory">Category</label>
                    <input
                        type="text"
                        id="productCategory"
                        placeholder="e.g. Electronics"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productEmoji">Emoji</label>
                    <input
                        type="text"
                        id="productEmoji"
                        placeholder="e.g. 📱"
                    >
                </div>

                <div class="form-group full">
                    <label for="productImage">Product Image URL</label>
                    <input
                        type="text"
                        id="productImage"
                        placeholder="https://example.com/image.jpg"
                    >
                </div>

                <div class="form-group full">
                    <label for="productDescription">Description</label>
                    <textarea
                        id="productDescription"
                        placeholder="Enter product description"
                    ></textarea>
                </div>

            </div>

            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveBtn"
                >
                    Add Product
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                    style="display:none;"
                >
                    Cancel Edit
                </button>

            </div>

        </form>
    </div>

    <!-- PRODUCTS -->
    <div class="products-header">
        <h2>All Products</h2>

        <button
            class="refresh-btn"
            onclick="loadProducts()"
        >
            🔄 Refresh
        </button>
    </div>

    <div id="products" class="product-grid">
        <div class="loading">
            Loading products...
        </div>
    </div>

</div>

<script>
/*
    LIVE RENDER BACKEND
*/
const API_URL = "https://kaycy-backend.onrender.com";

/* ADMIN SESSION */
const admin = JSON.parse(
    localStorage.getItem("kaycyMartAdmin") || "null"
);

const adminLoggedIn =
    localStorage.getItem("kaycyMartAdminLoggedIn");

if (
    !adminLoggedIn ||
    !admin ||
    admin.role !== "admin"
) {
    window.location.href = "Admin-Login.html";
}

document.getElementById("adminName").textContent =
    admin ? (admin.name || "Admin") : "Admin";

/* EDITING STATE */
let editingProductId = null;

/* MESSAGE */
function showMessage(text, type) {

    const message = document.getElementById("message");

    message.textContent = text;
    message.className = type;

    setTimeout(() => {
        message.className = "";
        message.style.display = "none";
    }, 4000);
}

/* ESCAPE HTML */
function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* FORMAT PRICE */
function formatPrice(price) {

    return "₦" + Number(price || 0).toLocaleString("en-NG");
}

/* LOAD PRODUCTS */
async function loadProducts() {

    const productsContainer =
        document.getElementById("products");

    productsContainer.innerHTML =
        '<div class="loading">Loading products...</div>';

    try {

        const response =
            await fetch(API_URL + "/api/products");

        if (!response.ok) {
            throw new Error(
                "Failed to load products."
            );
        }

        const data = await response.json();

        const products =
            Array.isArray(data)
                ? data
                : (data.products || []);

        if (!products.length) {

            productsContainer.innerHTML =
                '<div class="loading">No products found.</div>';

            return;
        }

        productsContainer.innerHTML =
            products.map(product => {

                const image =
                    product.image
                        ? `
                            <img
                                src="${escapeHTML(product.image)}"
                                alt="${escapeHTML(product.name)}"
                                onerror="this.style.display='none'; this.parentElement.innerHTML='${escapeHTML(product.emoji || "🛒")}'"
                            >
                          `
                        : escapeHTML(
                            product.emoji || "🛒"
                          );

                return `
                    <div class="product-card">

                        <div class="product-image">
                            ${image}
                        </div>

                        <div class="product-info">

                            <h3>
                                ${escapeHTML(product.name)}
                            </h3>

                            <span class="product-category">
                                ${escapeHTML(product.category)}
                            </span>

                            <div class="product-price">
                                ${formatPrice(product.price)}
                            </div>

                            <p class="product-description">
                                ${escapeHTML(
                                    product.description ||
                                    "No description available."
                                )}
                            </p>

                            <div class="product-actions">

                                <button
                                    class="btn edit-btn"
                                    onclick="editProduct(${Number(product.id)})"
                                >
                                    Edit
                                </button>

                                <button
                                    class="btn delete-btn"
                                    onclick="deleteProduct(${Number(product.id)})"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>

                    </div>
                `;

            }).join("");

    } catch (error) {

        console.error(error);

        productsContainer.innerHTML = `
            <div class="loading">
                Failed to load products.<br>
                Please check your internet connection and try again.
            </div>
        `;
    }
}

/* FORM SUBMIT */
document
    .getElementById("productForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("productName").value.trim();

        const price =
            Number(
                document.getElementById("productPrice").value
            );

        const category =
            document.getElementById("productCategory").value.trim();

        const emoji =
            document.getElementById("productEmoji").value.trim();

        const image =
            document.getElementById("productImage").value.trim();

        const description =
            document.getElementById("productDescription").value.trim();

        if (!name || !category || !price) {

            showMessage(
                "Please fill in the required fields.",
                "error"
            );

            return;
        }

        const productData = {
            name,
            price,
            category,
            emoji,
            image,
            description
        };

        const saveButton =
            document.getElementById("saveBtn");

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            let response;

            if (editingProductId) {

                response = await fetch(
                    API_URL +
                    "/api/admin/products/" +
                    editingProductId,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type": "application/json",
                            "x-admin-user-id":
                                String(admin.id)
                        },

                        body: JSON.stringify(productData)
                    }
                );

            } else {

                response = await fetch(
                    API_URL + "/api/admin/products",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "x-admin-user-id":
                                String(admin.id)
                        },

                        body: JSON.stringify(productData)
                    }
                );
            }

            const data =
                await response.json().catch(() => ({}));

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    data.message ||
                    "Unable to save product."
                );
            }

            showMessage(
                editingProductId
                    ? "Product updated successfully!"
                    : "Product added successfully!",
                "success"
            );

            resetForm();

            await loadProducts();

        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Something went wrong.",
                "error"
            );

        } finally {

            saveButton.disabled = false;

            saveButton.textContent =
                editingProductId
                    ? "Update Product"
                    : "Add Product";
        }
    });

/* EDIT PRODUCT */
async function editProduct(id) {

    try {

        const response =
            await fetch(API_URL + "/api/products");

        if (!response.ok) {
            throw new Error("Failed to load product.");
        }

        const data =
            await response.json();

        const products =
            Array.isArray(data)
                ? data
                : (data.products || []);

        const product =
            products.find(
                item => Number(item.id) === Number(id)
            );

        if (!product) {

            showMessage(
                "Product not found.",
                "error"
            );

            return;
        }

        editingProductId = product.id;

        document.getElementById("productName").value =
            product.name || "";

        document.getElementById("productPrice").value =
            product.price || "";

        document.getElementById("productCategory").value =
            product.category || "";

        document.getElementById("productEmoji").value =
            product.emoji || "";

        document.getElementById("productImage").value =
            product.image || "";

        document.getElementById("productDescription").value =
            product.description || "";

        document.getElementById("formTitle").textContent =
            "Edit Product";

        document.getElementById("saveBtn").textContent =
            "Update Product";

        document.getElementById("cancelBtn").style.display =
            "inline-block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to load product.",
            "error"
        );
    }
}

/* DELETE PRODUCT */
async function deleteProduct(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                API_URL +
                "/api/admin/products/" +
                id,
                {
                    method: "DELETE",

                    headers: {
                        "x-admin-user-id":
                            String(admin.id)
                    }
                }
            );

        const data =
            await response.json().catch(() => ({}));

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to delete product."
            );
        }

        showMessage(
            "Product deleted successfully!",
            "success"
        );

        await loadProducts();

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to delete product.",
            "error"
        );
    }
}

/* CANCEL EDIT */
function cancelEdit() {

    resetForm();
}

/* RESET FORM */
function resetForm() {

    editingProductId = null;

    document
        .getElementById("productForm")
        .reset();

    document.getElementById("formTitle").textContent =
        "Add New Product";

    document.getElementById("saveBtn").textContent =
        "Add Product";

    document.getElementById("cancelBtn").style.display =
        "none";
}

/* LOGOUT */
function logout() {

    localStorage.removeItem(
        "kaycyMartAdminLoggedIn"
    );

    localStorage.removeItem(
        "kaycyMartAdmin"
    );

    window.location.href =
        "Admin-Login.html";
}

/* START */
loadProducts();
</script>

</body>
</html>
