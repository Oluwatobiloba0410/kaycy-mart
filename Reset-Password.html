<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password - Kaycy Mart</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    color:#111827;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

header{
    background:#111827;
    color:white;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#f59e0b;
    white-space:nowrap;
}

nav{
    display:flex;
    gap:18px;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:15px;
}

nav a:hover{
    color:#f59e0b;
}

/* ================= MAIN ================= */

.reset-section{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
}

.reset-box{
    background:white;
    width:100%;
    max-width:430px;
    padding:40px 35px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

.reset-box h1{
    text-align:center;
    margin-bottom:10px;
    color:#111827;
}

.reset-intro{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    line-height:1.5;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#374151;
}

.password-box{
    position:relative;
}

.form-group input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.password-box input{
    padding-right:52px;
}

.form-group input:focus{
    border-color:#f59e0b;
    box-shadow:0 0 0 2px rgba(245,158,11,0.12);
}

/* ================= EYE BUTTON ================= */

.eye-btn{
    position:absolute;
    right:7px;
    top:50%;
    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:none;
    background:transparent;

    cursor:pointer;

    font-size:19px;
    color:#6b7280;

    display:flex;
    align-items:center;
    justify-content:center;
}

.eye-btn:hover{
    color:#111827;
}

/* ================= RESET BUTTON ================= */

.reset-btn{
    width:100%;
    height:48px;

    border:none;
    border-radius:8px;

    background:#f59e0b;
    color:#111827;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.reset-btn:hover{
    background:#d97706;
    color:white;
}

.reset-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:8px;
    text-align:center;
    line-height:1.5;
    font-size:14px;
}

.error-message{
    background:#fee2e2;
    color:#991b1b;
}

.success-message{
    background:#dcfce7;
    color:#166534;
}

/* ================= BACK ================= */

.back-login{
    display:block;
    text-align:center;
    margin-top:24px;
    color:#d97706;
    font-weight:bold;
    text-decoration:none;
}

.back-login:hover{
    text-decoration:underline;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        flex-direction:column;
        padding:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
        gap:12px;
    }

    nav a{
        font-size:14px;
    }

    .reset-section{
        padding:35px 15px;
        align-items:flex-start;
    }

    .reset-box{
        padding:30px 22px;
    }

}

</style></head><body><header><div class="logo">
    🛒 Kaycy Mart
</div><nav><a href="Index.html">
    Home
</a>

<a href="Products.html">
    Products
</a>

<a href="Cart.html">
    Cart
</a>

<a href="About.html">
    About
</a>

<a href="Contact.html">
    Contact
</a>

<a href="Login.html">
    Login
</a>

</nav></header><section class="reset-section"><div class="reset-box"><h1>
    Reset Password
</h1>

<p class="reset-intro">
    Enter a new password for your Kaycy Mart account.
</p>


<form id="resetForm">

    <!-- NEW PASSWORD -->

    <div class="form-group">

        <label for="newPassword">
            New Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button
                type="button"
                class="eye-btn"
                id="newPasswordEye"
                aria-label="Show password"
            >
                👁
            </button>

        </div>

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="form-group">

        <label for="confirmPassword">
            Confirm New Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button
                type="button"
                class="eye-btn"
                id="confirmPasswordEye"
                aria-label="Show password"
            >
                👁
            </button>

        </div>

    </div>


    <button
        type="submit"
        class="reset-btn"
        id="resetBtn"
    >
        Reset Password
    </button>


    <div
        class="message error-message"
        id="errorMessage"
    ></div>


    <div
        class="message success-message"
        id="successMessage"
    ></div>

</form>


<a
    href="Login.html"
    class="back-login"
>
    ← Back to Login
</a>

</div></section><script>

/* ================= API ================= */

const API_URL =
    "https://kaycy-backend.onrender.com";


/* ================= EMAIL ================= */

const resetEmail =
    localStorage.getItem(
        "kaycyMartResetEmail"
    );


/* ================= ELEMENTS ================= */

const resetForm =
    document.getElementById(
        "resetForm"
    );

const resetBtn =
    document.getElementById(
        "resetBtn"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );

const newPassword =
    document.getElementById(
        "newPassword"
    );

const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


/* ================= CHECK EMAIL ================= */

if(!resetEmail){

    resetForm.style.display =
        "none";

    errorMessage.textContent =
        "❌ No password reset request was found. Please start again.";

    errorMessage.style.display =
        "block";

}


/* ================= PASSWORD TOGGLE ================= */

function setupEyeButton(
    buttonId,
    input
){

    const button =
        document.getElementById(
            buttonId
        );


    button.addEventListener(
        "click",
        function(){

            if(input.type === "password"){

                input.type =
                    "text";

                button.textContent =
                    "🙈";

                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            }else{

                input.type =
                    "password";

                button.textContent =
                    "👁";

                button.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );

}


setupEyeButton(
    "newPasswordEye",
    newPassword
);

setupEyeButton(
    "confirmPasswordEye",
    confirmPassword
);


/* ================= RESET PASSWORD ================= */

resetForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const password =
            newPassword.value;

        const confirm =
            confirmPassword.value;


        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";


        if(password.length < 6){

            errorMessage.textContent =
                "❌ Password must be at least 6 characters.";

            errorMessage.style.display =
                "block";

            return;

        }


        if(password !== confirm){

            errorMessage.textContent =
                "❌ The passwords do not match.";

            errorMessage.style.display =
                "block";

            return;

        }


        resetBtn.disabled =
            true;

        resetBtn.textContent =
            "Resetting...";


        try{

            const response =
                await fetch(
                    API_URL +
                    "/api/reset-password",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            email:
                                resetEmail,

                            newPassword:
                                password

                        })

                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Could not reset password."
                );

            }


            /* CLEAR RESET EMAIL */

            localStorage.removeItem(
                "kaycyMartResetEmail"
            );


            /* SHOW SUCCESS */

            successMessage.textContent =
                "✅ Password reset successfully! Redirecting to Login...";

            successMessage.style.display =
                "block";


            resetForm.reset();


            setTimeout(function(){

                window.location.href =
                    "Login.html";

            },1500);


        }catch(error){

            console.error(
                "Reset password error:",
                error
            );


            errorMessage.textContent =
                "❌ " +
                (
                    error.message ||
                    "Unable to reset password."
                );


            errorMessage.style.display =
                "block";


            resetBtn.disabled =
                false;

            resetBtn.textContent =
                "Reset Password";

        }

    }
);

</script></body>
</html>
