<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password - Kaycy Mart</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    color:#222;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

header{
    background:#111827;
    color:white;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#f59e0b;
    white-space:nowrap;
}

nav{
    display:flex;
    gap:18px;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:15px;
}

nav a:hover{
    color:#f59e0b;
}

/* ================= MAIN ================= */

.forgot-section{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
}

.forgot-box{
    background:white;
    width:100%;
    max-width:430px;
    padding:40px 35px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

.forgot-box h1{
    text-align:center;
    color:#111827;
    margin-bottom:10px;
}

.forgot-intro{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    line-height:1.5;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#374151;
}

.form-group input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.form-group input:focus{
    border-color:#f59e0b;
    box-shadow:0 0 0 2px rgba(245,158,11,0.12);
}

/* ================= BUTTON ================= */

.forgot-btn{
    width:100%;
    border:none;
    background:#f59e0b;
    color:#111827;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.forgot-btn:hover{
    background:#d97706;
    color:white;
}

.forgot-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:8px;
    text-align:center;
    line-height:1.5;
}

.error-message{
    background:#fee2e2;
    color:#991b1b;
}

.success-message{
    background:#dcfce7;
    color:#166534;
}

/* ================= BACK ================= */

.back-login{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#d97706;
    font-weight:bold;
    text-decoration:none;
}

.back-login:hover{
    text-decoration:underline;
}

/* ================= FOOTER ================= */

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 20px;
}

footer h3{
    color:#f59e0b;
    margin-bottom:8px;
}

footer p{
    color:#d1d5db;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        flex-direction:column;
        padding:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
        gap:12px;
    }

    nav a{
        font-size:14px;
    }

    .forgot-section{
        padding:35px 15px;
    }

    .forgot-box{
        padding:30px 22px;
    }

}

</style></head><body><header><div class="logo">
    🛒 Kaycy Mart
</div><nav><a href="Index.html">Home</a>

<a href="Products.html">Products</a>

<a href="Cart.html">Cart</a>

<a href="About.html">About</a>

<a href="Contact.html">Contact</a>

<a href="Login.html">Login</a>

</nav></header><section class="forgot-section"><div class="forgot-box"><h1>
    Forgot Password?
</h1>

<p class="forgot-intro">
    Enter the email address linked to your
    Kaycy Mart account.
</p>


<form id="forgotForm">

    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

    </div>


    <button
        type="submit"
        class="forgot-btn"
        id="forgotBtn"
    >
        Continue
    </button>


    <div
        class="message error-message"
        id="errorMessage"
    ></div>


    <div
        class="message success-message"
        id="successMessage"
    ></div>

</form>


<a
    href="Login.html"
    class="back-login"
>
    ← Back to Login
</a>

</div></section><footer><h3>
    🛒 Kaycy Mart
</h3><p>
    Your online marketplace for everyday products.
</p></footer><script>

/* ================= API ================= */

const API_URL =
    "https://kaycy-backend.onrender.com";


/* ================= ELEMENTS ================= */

const forgotForm =
    document.getElementById("forgotForm");

const forgotBtn =
    document.getElementById("forgotBtn");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");


/* ================= FORGOT PASSWORD ================= */

forgotForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";


        forgotBtn.disabled =
            true;

        forgotBtn.textContent =
            "Checking...";


        try{

            const response =
                await fetch(
                    API_URL +
                    "/api/forgot-password",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            email:email
                        })

                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Account not found."
                );

            }


            /* SAVE EMAIL FOR RESET */

            localStorage.setItem(
                "kaycyMartResetEmail",
                email
            );


            successMessage.textContent =
                "✅ Account found! Redirecting to password reset...";

            successMessage.style.display =
                "block";


            setTimeout(function(){

                window.location.href =
                    "Reset-Password.html";

            },1200);


        }catch(error){

            console.error(
                "Forgot password error:",
                error
            );


            errorMessage.textContent =
                "❌ " +
                (
                    error.message ||
                    "Unable to check account."
                );


            errorMessage.style.display =
                "block";


            forgotBtn.disabled =
                false;

            forgotBtn.textContent =
                "Continue";

        }

    }
);

</script></body>
</html>
